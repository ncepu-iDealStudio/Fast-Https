# Windows 的 NSIS 安装包不在本文件里：它由 build/package.ps1 在 goreleaser 结束后
# 调用 makensis 生成（需要 NSIS 3.x）。只跑 goreleaser 会得到 zip / tar.gz 与
# 主程序、桌面端的 deb / rpm / apk，不会出现 setup.exe。
version: 2

before:
  hooks:
    - go mod tidy
    # 手册页由命令树生成，打包前刷新一次，避免装出来的 man 与二进制命令不一致
    - go run ./tools/manpage

builds:
  - id: unix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: fast-https
    main: ./fast-https.go

  - id: windows-amd64
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    binary: fast-https
    main: ./fast-https.go
    ldflags:
      - "-s -w -H=windowsgui"

  - id: windows-arm64
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - arm64
    binary: fast-https
    main: ./fast-https.go
    ldflags:
      - "-s -w -H=windowsgui"

  # 发行版包专用：带 rpm tag，运行期资源定位到 /usr/share/fast-https/
  - id: linux-pkg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: fast-https
    main: ./fast-https.go
    tags:
      - rpm

  # 独立 Monitor：只读本机 /runtime 与 PID 文件，不 import 仓库其他包，
  # 因此不需要 rpm tag——发行版包里的路径由 systemd 单元的 -config/-dir 给出。
  - id: monitor-unix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: fast-https-monitor
    main: ./monitor

  # Windows 的 zip 是「一个架构一个包」，这里必须按架构拆开：若同一个
  # build 同时产出 amd64 与 arm64，`windows-amd64` 归档在 amd64 下能拿到
  # 两份二进制、在 arm64 下只拿得到一份，goreleaser 会以
  # `invalid archive: ... different count of binaries for each platform` 拒绝。
  - id: monitor-windows-amd64
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    binary: fast-https-monitor
    main: ./monitor

  - id: monitor-windows-arm64
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - arm64
    binary: fast-https-monitor
    main: ./monitor

  # 发行版包专用：同一份代码，单独 id 让 nfpms 只取 linux 产物。
  - id: monitor-linux-pkg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: fast-https-monitor
    main: ./monitor
    ldflags:
      - "-s -w"

  # 桌面管理端：独立 Go module。Linux 后端必须 CGO_ENABLED=0 + purego 才能在
  # Windows 上交叉编译（buildguard 要求二者之一），运行期再加载系统 GTK4/WebKitGTK。
  # 前端 dist 与 .desktop 由 build/package.ps1 在调用 goreleaser 之前准备好。
  - id: desktop-linux
    dir: desktop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: fast-https-desktop
    main: .
    tags:
      - production
      - purego
    ldflags:
      - "-s -w"

archives:
  - id: unix
    ids:
      - unix
      - monitor-unix
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - config/cert/.keep
      - config/cert/acme/.keep
      - config/conf.d/.keep
      - config/conf.d/default.json
      - config/fast-https.json
      - config/mime.json
      - docs/usage.html
      - httpdoc/root/favicon.ico
      - httpdoc/root/index.html
      - logs/.keep
      - README.md

  - id: windows-amd64
    ids:
      - windows-amd64
      - monitor-windows-amd64
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - config/cert/.keep
      - config/cert/acme/.keep
      - config/conf.d/.keep
      - config/conf.d/default.json
      - config/fast-https.json
      - config/mime.json
      - docs/usage.html
      - httpdoc/root/favicon.ico
      - httpdoc/root/index.html
      - logs/.keep
      - README.md

  - id: windows-arm64
    ids:
      - windows-arm64
      - monitor-windows-arm64
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - config/cert/.keep
      - config/cert/acme/.keep
      - config/conf.d/.keep
      - config/conf.d/default.json
      - config/fast-https.json
      - config/mime.json
      - docs/usage.html
      - httpdoc/root/favicon.ico
      - httpdoc/root/index.html
      - logs/.keep
      - README.md

nfpms:
  - id: linux-packages
    ids:
      - linux-pkg
      - monitor-linux-pkg
    package_name: fast-https
    vendor: NCEPU-BJ
    homepage: https://gitee.com/ncepu-bj/fast-https
    maintainer: JFeng2048 <JFeng2048@outlook.com>
    description: |-
      Fast-Https 是一款 Go 编写的 web server 与反向代理。
    license: GPL-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    umask: 0o022
    # 仓库元数据：apt / dnf 解析依赖与分类时读这些字段。
    section: web
    priority: optional
    # ACME 校验与 HTTPS 上游都要系统 CA 证书；最小化容器里没有这个包。
    # 日志写在 /var/log/fast-https 且进程常开 fd，必须靠 logrotate 轮转，
    # 没有它日志会无限增长——所以是硬依赖，而不是"有就用"。
    dependencies:
      - ca-certificates
      - logrotate
    # Debian revision：仓库里同一 upstream 版本的多次打包靠它区分。
    release: "1"
    deb:
      compression: xz
    rpm:
      group: Applications/Internet
      summary: Go web server and reverse proxy with automatic HTTPS
      packager: JFeng2048 <JFeng2048@outlook.com>
    # 按 FHS 分离：配置与证书进 /etc，站点进 /usr/share，日志进 /var/log。
    # /run/fast-https 不打包（rpm 不接受包内 /run 内容），由 systemd 的
    # RuntimeDirectory 与 postinstall 脚本创建。
    contents:
      - src: config/fast-https.json
        dst: /etc/fast-https/fast-https.json
        type: config|noreplace
      - src: config/mime.json
        dst: /etc/fast-https/mime.json
        type: config|noreplace
      - src: httpdoc/root/index.html
        dst: /usr/share/fast-https/httpdoc/root/index.html
      - src: httpdoc/root/favicon.ico
        dst: /usr/share/fast-https/httpdoc/root/favicon.ico
      - src: docs/usage.html
        dst: /usr/share/doc/fast-https/usage.html
      # 默认那份是中文页：与二进制的默认语言一致，装完 man fast-https 直接能看懂。
      - src: build/packaging/man/fast-https.1
        dst: /usr/share/man/man1/fast-https.1
      # 英文页按 locale 目录装。LANG=en_US / en_GB 时 man 会先命中这一份，
      # 其他语言仍回落到上面那份中文页。
      - src: build/packaging/man/fast-https.en.1
        dst: /usr/share/man/en/man1/fast-https.1
      - src: LICENSE
        dst: /usr/share/licenses/fast-https/LICENSE
      - src: build/packaging/systemd/fast-https.service
        dst: /usr/lib/systemd/system/fast-https.service
      # 轮转策略跟包走：日志目录是 /var/log/fast-https（root 所有），
      # 用户不该为了不让磁盘写满而自己写一份 logrotate 配置。
      # Monitor 与主程序分开的单元：Server 起不来时它仍要能跑，所以不并进
      # fast-https.service。配置登记为 config|noreplace，升级不覆盖运维改过的阈值。
      - src: build/packaging/systemd/fast-https-monitor.service
        dst: /usr/lib/systemd/system/fast-https-monitor.service
      - src: build/packaging/monitor.json
        dst: /etc/fast-https/monitor.json
        type: config|noreplace
      - src: build/packaging/logrotate/fast-https
        dst: /etc/logrotate.d/fast-https
        type: config|noreplace
      - dst: /etc/fast-https/cert
        type: dir
      # ACME 的账户与证书缓存目录：包安装后由 root 运行，目录必须预先存在，
      # 否则非 systemd 手工启动时要先手工建目录才能写账户私钥。
      - dst: /etc/fast-https/cert/acme
        type: dir
      - dst: /etc/fast-https/conf.d
        type: dir
      - src: config/conf.d/default.json
        dst: /etc/fast-https/conf.d/default.json
        type: config|noreplace
      - dst: /var/log/fast-https
        type: dir
      - dst: /var/lib/fast-https
        type: dir
        file_info:
          mode: 0700
      # 与 Windows 归档一样用 .keep 占住这三个目录：只留空目录时，
      # 打包工具或解包工具容易把它们当成空壳丢掉。
      - src: config/cert/.keep
        dst: /etc/fast-https/cert/.keep
      - src: config/cert/acme/.keep
        dst: /etc/fast-https/cert/acme/.keep
      - src: config/conf.d/.keep
        dst: /etc/fast-https/conf.d/.keep
      - src: logs/.keep
        dst: /var/log/fast-https/.keep
      - src: config/cert/acme/.keep
        dst: /var/lib/fast-https/.keep
    scripts:
      postinstall: build/packaging/linux/postinstall.sh
      preremove: build/packaging/linux/preremove.sh
      postremove: build/packaging/linux/postremove.sh

  # 桌面管理端：GTK4 / WebKitGTK 6.0 的包名在 deb、rpm、apk 里各不相同，
  # 所以按格式拆成三条，避免 rpm/apk 因为 Debian 包名找不到依赖而装不上。
  # 三种格式共用同一份二进制、图标与 .desktop，只有依赖名与格式字段不同。
  - id: desktop-deb
    ids:
      - desktop-linux
      - monitor-linux-pkg
    package_name: fast-https-desktop
    vendor: NCEPU-BJ
    homepage: https://gitee.com/ncepu-bj/fast-https
    maintainer: JFeng2048 <JFeng2048@outlook.com>
    description: |-
      Fast-Https 桌面管理端：状态、站点、证书与主配置表单。
    license: GPL-2.0
    formats:
      - deb
    bindir: /usr/bin
    umask: 0o022
    section: web
    priority: optional
    dependencies:
      - libgtk-4-1
      - libwebkitgtk-6.0-4
      - ca-certificates
      - logrotate

    release: "1"
    deb:
      compression: xz
    # 同一个文件不能被两个包各装一份：桌面端包与主程序包互斥，
    # 装了本包就会替换掉独立主程序包，最终 /usr/bin/fast-https 只有一份。
    conflicts:
      - fast-https
    replaces:
      - fast-https
    contents:
      # 自带的主程序与独立主程序包完全一致：同一个构建产物、同一个 /usr/bin 路径，
      # 桌面端按「同目录找 fast-https」的常规逻辑就能调用，不需要特殊回退。
      - src: dist/linux-pkg_linux_{{ .Arch }}*/fast-https
        dst: /usr/bin/
        file_info:
          mode: 0o755
      - src: desktop/build/appicon.png
        dst: /usr/share/icons/hicolor/256x256/apps/fast-https-desktop.png
      - src: desktop/build/linux/fast-https-desktop.desktop
        dst: /usr/share/applications/fast-https-desktop.desktop
      # 以下运行期资源与维护脚本和独立主程序包完全一致：桌面端包 = 主程序包 + 桌面端，
      # 离线只装这一个包也能直接 fast-https start。改主程序条目时要同步这里。
      - src: config/fast-https.json
        dst: /etc/fast-https/fast-https.json
        type: config|noreplace
      - src: config/mime.json
        dst: /etc/fast-https/mime.json
        type: config|noreplace
      - src: httpdoc/root/index.html
        dst: /usr/share/fast-https/httpdoc/root/index.html
      - src: httpdoc/root/favicon.ico
        dst: /usr/share/fast-https/httpdoc/root/favicon.ico
      - src: docs/usage.html
        dst: /usr/share/doc/fast-https/usage.html
      - src: build/packaging/man/fast-https.1
        dst: /usr/share/man/man1/fast-https.1
      - src: build/packaging/man/fast-https.en.1
        dst: /usr/share/man/en/man1/fast-https.1
      - src: LICENSE
        dst: /usr/share/licenses/fast-https/LICENSE
      - src: build/packaging/systemd/fast-https.service
        dst: /usr/lib/systemd/system/fast-https.service
      # Monitor 与主程序分开的单元：Server 起不来时它仍要能跑，所以不并进
      # fast-https.service。配置登记为 config|noreplace，升级不覆盖运维改过的阈值。
      - src: build/packaging/systemd/fast-https-monitor.service
        dst: /usr/lib/systemd/system/fast-https-monitor.service
      - src: build/packaging/monitor.json
        dst: /etc/fast-https/monitor.json
        type: config|noreplace
      - src: build/packaging/logrotate/fast-https
        dst: /etc/logrotate.d/fast-https
        type: config|noreplace
      - dst: /etc/fast-https/cert
        type: dir
      - dst: /etc/fast-https/cert/acme
        type: dir
      - dst: /etc/fast-https/conf.d
        type: dir
      - src: config/conf.d/default.json
        dst: /etc/fast-https/conf.d/default.json
        type: config|noreplace
      - dst: /var/log/fast-https
        type: dir
      - src: config/cert/.keep
        dst: /etc/fast-https/cert/.keep
      - src: config/cert/acme/.keep
        dst: /etc/fast-https/cert/acme/.keep
      - src: config/conf.d/.keep
        dst: /etc/fast-https/conf.d/.keep
      - src: logs/.keep
        dst: /var/log/fast-https/.keep
    scripts:
      postinstall: build/packaging/linux/postinstall.sh
      preremove: build/packaging/linux/preremove.sh
      postremove: build/packaging/linux/postremove.sh

