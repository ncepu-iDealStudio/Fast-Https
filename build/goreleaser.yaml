      - src: build/packaging/systemd/fast-https.service
        dst: /usr/lib/systemd/system/fast-https.service
      # Monitor 与主程序分开的单元：Server 起不来时它仍要能跑，所以不并进
      # fast-https.service。配置登记为 config|noreplace，升级不覆盖运维改过的阈值。
      - src: build/packaging/systemd/fast-https-monitor.service
        dst: /usr/lib/systemd/system/fast-https-monitor.service
      - src: build/packaging/monitor.json
        dst: /etc/fast-https/monitor.json
        type: config|noreplace
      - src: build/packaging/logrotate/fast-https
        dst: /etc/logrotate.d/fast-https
        type: config|noreplace
      - dst: /etc/fast-https/cert
        type: dir
      - dst: /etc/fast-https/cert/acme
        type: dir
      - dst: /etc/fast-https/conf.d
        type: dir
      - src: config/conf.d/default.json
        dst: /etc/fast-https/conf.d/default.json
        type: config|noreplace
      - dst: /var/log/fast-https
        type: dir
      - src: config/cert/.keep
        dst: /etc/fast-https/cert/.keep
      - src: config/cert/acme/.keep
        dst: /etc/fast-https/cert/acme/.keep
      - src: config/conf.d/.keep
        dst: /etc/fast-https/conf.d/.keep
      - src: logs/.keep
        dst: /var/log/fast-https/.keep
    scripts:
      postinstall: build/packaging/linux/postinstall.sh
      preremove: build/packaging/linux/preremove.sh
      postremove: build/packaging/linux/postremove.sh

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "1.6.1"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
