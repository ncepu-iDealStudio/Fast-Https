      - src: httpdoc/root/favicon.ico
        dst: /usr/share/fast-https/httpdoc/root/favicon.ico
      - src: docs/usage.html
        dst: /usr/share/doc/fast-https/usage.html
      - src: build/packaging/man/fast-https.1
