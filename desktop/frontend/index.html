<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="data:,"/>
  <title>Fast-Https</title>
  <script>
    // 首屏骨架跟随上次保存的主题与侧栏状态，避免暗色主题先闪一帧白色、
    // 或者侧栏从 200px 跳到折叠态 56px。
    (function () {
      try {
        var mode = localStorage.getItem('fast-https.mode') || 'dark';
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.mode = dark ? 'dark' : 'light';
        document.documentElement.dataset.rail =
          localStorage.getItem('fast-https.railCollapsed') === '0' ? 'wide' : 'rail';
      } catch (e) { /* localStorage 不可用时保持默认暗色 */ }
    })();
  </script>
  <style>
    /* 首屏骨架：Vue 挂载前先画出与真实布局同构的占位，避免 dev 首次启动
       时 Webview 抢在 Vite 依赖预构建完成之前渲染出「只有侧边栏」的半成品。 */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F4F5F9; }
    html[data-mode="dark"], html[data-mode="dark"] body { background: #0D1017; }
    #boot {
      height: 100%; display: flex; flex-direction: column;
      font: 400 13.5px/1.7 "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      color: #686E82;
    }
    html[data-mode="dark"] #boot { color: #848CA4; }
    #boot .top { height: 52px; flex: 0 0 52px; background: transparent; }
    #boot .body { flex: 1; display: grid; grid-template-columns: 212px 1fr; gap: 12px; padding: 0 12px 12px; min-height: 0; }
    html[data-rail="rail"] #boot .body { grid-template-columns: 68px 1fr; }
    #boot .side { background: rgba(255,255,255,.78); border: 1px solid #E5E7F0; border-radius: 20px; }
    html[data-mode="dark"] #boot .side { background: rgba(21,24,34,.78); border-color: #23283A; }
    #boot .hold { display: grid; place-items: center; background: rgba(255,255,255,.78); border: 1px solid #E5E7F0; border-radius: 20px; }
    html[data-mode="dark"] #boot .hold { background: rgba(21,24,34,.78); border-color: #23283A; }
    #boot .hold span { font-size: 12px; color: #848CA4; letter-spacing: .04em; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="top"></div>
  <div class="body">
    <div class="side"></div>
    <div class="hold"><span>Fast-Https</span></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
