version: '3'

vars:
  APP_NAME: "fast-https-desktop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 桌面端当前只发布 Windows（NSIS 安装包），Linux 桌面包不在计划内。
  GOOS: '{{.GOOS | default "windows"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    desc: 构建应用（Windows）
    summary: 构建应用
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    desc: 打包（Windows NSIS）
    summary: 打包
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    desc: 运行应用
    summary: 运行应用
    cmds:
      - task: "{{.GOOS}}:run"

  # 桌面端只重建自己（fast-https-desktop.exe），同目录的 fast-https.exe 不会跟着更新。
  # 开发时忘了重建就会拿旧 CLI 跑，出现「代码明明改了却没生效」的错觉，所以 dev 前先构建。
  cli:
    desc: 构建主程序 CLI 到 bin/（桌面端从同目录调用）
    summary: 构建主程序 CLI
    dir: ..
    cmds:
      # Windows 上正在运行的 exe 无法覆盖；dev 重启时先停掉旧服务。
      - cmd: taskkill /IM fast-https.exe /F
        ignore_error: true
      # 输出到 desktop/bin，和桌面端 exe 放在一起（桌面端就是从同目录调用它）
      - go build -o desktop/{{.BIN_DIR}}/fast-https.exe .

  dev:
    desc: 启动开发模式（Vite dev server + 热重载）
    summary: 开发模式，先构建主程序 CLI 再起界面
    cmds:
      - task: cli
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
