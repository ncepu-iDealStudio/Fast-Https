version: '3'

vars:
  APP_NAME: "fast-https-desktop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 桌面端当前只发布 Windows（NSIS 安装包），Linux 桌面包不在计划内。
  GOOS: '{{.GOOS | default "windows"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    desc: 构建应用（Windows）
    summary: 构建应用
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    desc: 打包（Windows NSIS）
    summary: 打包
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    desc: 运行应用
    summary: 运行应用
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    desc: 启动开发模式（Vite dev server + 热重载）
    summary: 开发模式
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
