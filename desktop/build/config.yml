# Wails v3 项目配置。只维护 Windows NSIS 与 Linux deb 两条打包链。
# 改 info 后运行 `wails3 task common:update:build-assets` 会重新生成资产，
# 但会覆盖手写的 build/windows/nsis/project.nsi，慎用。
version: '3'

info:
  companyName: "NCEPU BJ"
  productName: "Fast-Https Desktop"
  productIdentifier: "com.ncepu-bj.fast-https.desktop"
  description: "Fast-Https 本机管理端：状态、站点、证书与配置重载"
  copyright: "GPL-2.0, NCEPU BJ"
  comments: "Wails v3 桌面管理端"
  version: "1.5.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
