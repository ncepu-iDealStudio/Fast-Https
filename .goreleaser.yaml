version: 2

before:
  hooks:
    - go mod tidy
    # 托盘程序目前只提供 amd64 版本（Windows on ARM 可经 x64 模拟运行）
    - go build -ldflags "-s -w -H=windowsgui" -o monitor/monitor.exe ./monitor

builds:
  - id: unix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: fast-https
    main: ./fast-https.go

  - id: windows-amd64
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    binary: fast-https
    main: ./fast-https.go
    ldflags:
      - "-s -w -H=windowsgui"

  - id: windows-arm64
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - arm64
    binary: fast-https
    main: ./fast-https.go
    ldflags:
      - "-s -w -H=windowsgui"

archives:
  - id: unix
    ids:
      - unix
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - config/cert/.keep
      - config/conf.d/.keep
      - config/fast-https.json
      - config/fastcgi.conf
      - config/mime.json
      - docs/usage.html
      - httpdoc/root/favicon.ico
      - httpdoc/root/index.html
      - logs/.keep
      - README.md

  - id: windows-amd64
    ids:
      - windows-amd64
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - config/cert/.keep
      - config/conf.d/.keep
      - config/fast-https.json
      - config/fastcgi.conf
      - config/mime.json
      - docs/usage.html
      - httpdoc/root/favicon.ico
      - httpdoc/root/index.html
      - logs/.keep
      - README.md
      - src: monitor/monitor.exe
        strip_parent: true

  - id: windows-arm64
    ids:
      - windows-arm64
    formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - config/cert/.keep
      - config/conf.d/.keep
      - config/fast-https.json
      - config/fastcgi.conf
      - config/mime.json
      - docs/usage.html
      - httpdoc/root/favicon.ico
      - httpdoc/root/index.html
      - logs/.keep
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "1.4.0-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
